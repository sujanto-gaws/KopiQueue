name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # publish.yml runs the full CI for a version tag, then publishes its packages

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  build:
    name: build + pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # MinVer derives versions from tags
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x # also install the net10.0 runtime for multi-targeted tests
      - run: dotnet restore KopiQueue.slnx
      - run: dotnet build KopiQueue.slnx -c $CONFIGURATION --no-restore
      - name: unit tests
        run: dotnet test --project tests/KopiQueue.Tests -c $CONFIGURATION --no-build
      - run: dotnet pack KopiQueue.slnx -c $CONFIGURATION --no-build -o artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages

  postgres:
    name: postgres ${{ matrix.pg }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: ["14", "15", "16", "17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: kopi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      KOPI_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=kopi;Database=postgres
      # River's CLI at the pinned version, run as a black box: the main line must leave the same catalog (task 1.2).
      KOPI_RIVER_CLI: ${{ github.workspace }}/.river/river
      # A River client driven through its public API, for the interop suite (task 2.10, tests/compat/go).
      KOPI_RIVER_COMPAT: ${{ github.workspace }}/.river/kopi-river-compat
      KOPI_REQUIRE_RIVER_CLI: "1"
      RIVER_VERSION: v0.51.2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - name: install River CLI
        run: GOBIN="$GITHUB_WORKSPACE/.river" go install "github.com/riverqueue/river/cmd/river@$RIVER_VERSION"
      - name: build River interop harness
        working-directory: tests/compat/go
        run: go build -o "$KOPI_RIVER_COMPAT" .
      - run: dotnet build tests/KopiQueue.Npgsql.Tests -c $CONFIGURATION
      - run: >-
          dotnet test --project tests/KopiQueue.Npgsql.Tests -c $CONFIGURATION --no-build
          --report-trx --coverage --coverage-output-format cobertura
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-postgres-${{ matrix.pg }}
          path: tests/**/TestResults/**

  sqlserver:
    name: sqlserver ${{ matrix.mssql }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mssql: ["2019-latest", "2022-latest", "2025-latest"]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.mssql }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Kopi_Test_Passw0rd!
        ports: ["1433:1433"]
        # No health check: sqlcmd's path differs between images. The test fixture waits for the server instead.
    env:
      KOPI_TEST_MSSQL: Server=localhost,1433;User Id=sa;Password=Kopi_Test_Passw0rd!;TrustServerCertificate=true;Encrypt=true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - run: dotnet build tests/KopiQueue.SqlServer.Tests -c $CONFIGURATION
      - run: >-
          dotnet test --project tests/KopiQueue.SqlServer.Tests -c $CONFIGURATION --no-build
          --report-trx --coverage --coverage-output-format cobertura
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-sqlserver-${{ matrix.mssql }}
          path: tests/**/TestResults/**
