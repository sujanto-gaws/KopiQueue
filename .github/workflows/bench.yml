name: bench

# The macro benchmarks (bench/KopiQueue.Benchmarks): weekly, on demand, and on pull requests that change them (plan §6,
# "Benchmarks"). Each report goes to the job summary and to an artifact. Numbers from shared runners are noisy: compare
# them with each other, not with a developer machine.
on:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "bench/**"
      - ".github/workflows/bench.yml"

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release

jobs:
  sqlserver:
    name: bench sqlserver ${{ matrix.mssql }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mssql: ["2019-latest", "2022-latest", "2025-latest"]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:${{ matrix.mssql }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Kopi_Test_Passw0rd!
        ports: ["1433:1433"]
    env:
      KOPI_BENCH_MSSQL: Server=localhost,1433;User Id=sa;Password=Kopi_Test_Passw0rd!;TrustServerCertificate=true;Encrypt=true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x
      - run: dotnet build bench/KopiQueue.Benchmarks -c $CONFIGURATION
      - name: Run # the benchmark waits for the server to accept logins
        run: |
          dotnet run --project bench/KopiQueue.Benchmarks -c $CONFIGURATION --no-build -- sqlserver > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-sqlserver-${{ matrix.mssql }}
          path: report.md
          if-no-files-found: ignore
