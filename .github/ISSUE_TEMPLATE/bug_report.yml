name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code, configuration and SQL needed to reproduce.
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [PostgreSQL, SQL Server, Azure SQL Database, Azure SQL Managed Instance, Other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: KopiQueue package, .NET runtime, database server version
      placeholder: "KopiQueue 0.2.0-alpha, .NET 11.0.0, PostgreSQL 17.4"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / stack traces
      render: text
